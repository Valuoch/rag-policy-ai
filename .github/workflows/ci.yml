name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLM_MODE: extractive   # CI never calls a remote LLM
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache embedding / re-ranking models
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: fastembed-${{ hashFiles('rag/config.py') }}

      - name: Import check
        run: python -c "import app; print('import ok')"

      - name: Corpus stats
        run: python -m rag.ingest --stats

      - name: Unit + end-to-end tests
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml

      - name: Build index and smoke-test the server
        run: |
          python -m rag.ingest
          gunicorn app:app --bind 127.0.0.1:8000 --workers 1 --threads 2 --timeout 120 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/health -o reports/health.json
          curl -sf -X POST http://127.0.0.1:8000/chat -H 'Content-Type: application/json' \
            -d '{"question":"How many days do I have to submit an expense report?"}' -o reports/chat.json
          curl -sf -X POST http://127.0.0.1:8000/chat -H 'Content-Type: application/json' \
            -d '{"question":"What is the capital of France?"}' -o reports/refusal.json
          python -c "import json; d=json.load(open('reports/chat.json')); assert d['citations'] and not d['refused'], d"
          python -c "import json; d=json.load(open('reports/refusal.json')); assert d['refused'], d"

      - name: CI report (run summary)
        if: always()
        run: python scripts/ci_report.py

      - name: Upload CI report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-report
          path: |
            reports/
            index/manifest.json
            PolicyBot-Project-Report.pdf
          if-no-files-found: warn

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping deploy." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL" && echo "Render deploy triggered for ${GITHUB_SHA::7}." | tee -a "$GITHUB_STEP_SUMMARY"
